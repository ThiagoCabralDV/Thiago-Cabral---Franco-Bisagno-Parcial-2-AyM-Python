{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Mi Perfil - Foro J</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'accounts/estilos.css' %}">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center min-vh-100">

  <div class="login-card text-center">
    <h3 class="text-light mb-4">👤 Mi perfil</h3>
    <p class="text-light mb-2"><strong>Usuario:</strong> {{ user.username }}</p>
    <p class="text-light mb-2"><strong>Email:</strong> {{ user.email }}</p>
    <a href="{% url 'logout' %}" class="btn btn-danger mt-4">Cerrar sesión</a>
  </div>

</body>
</html>
