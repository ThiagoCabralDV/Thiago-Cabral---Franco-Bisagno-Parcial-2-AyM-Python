{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registrarse - Foro J</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'accounts/estilos.css' %}">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center min-vh-100">

  <div class="login-card text-dark">
    <div class="text-center mb-4">
      <h3 class="fw-bold text-light">🎮 Crear cuenta</h3>
      <p class="text-secondary mb-0">Únete a <strong>Foro J</strong> y comparte reseñas</p>
    </div>

    <form method="POST" action="">
      {% csrf_token %}

      <div class="mb-3">
        <label for="username" class="form-label text-light">Nombre de usuario</label>
        <div class="input-group">
          <input type="text" name="username" id="username" class="form-control" placeholder="Elige un usuario" required>
          <span class="input-group-text"><i class="fas fa-user"></i></span>
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label text-light">Email</label>
        <div class="input-group">
          <input type="email" name="email" id="email" class="form-control" placeholder="tu@email.com" required>
          <span class="input-group-text"><i class="fas fa-envelope"></i></span>
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label text-light">Contraseña</label>
        <div class="input-group">
          <input type="password" name="password" id="password" class="form-control" placeholder="Contraseña" required>
          <span class="input-group-text password-toggle" data-target="password"><i class="fas fa-eye"></i></span>
        </div>
      </div>

      <div class="mb-3">
        <label for="password2" class="form-label text-light">Repetir contraseña</label>
        <div class="input-group">
          <input type="password" name="password2" id="password2" class="form-control" placeholder="Repite la contraseña" required>
          <span class="input-group-text password-toggle" data-target="password2"><i class="fas fa-eye"></i></span>
        </div>
      </div>

      {% if messages %}
        <div class="alert alert-danger py-2">
          {% for message in messages %}
            {{ message }}
          {% endfor %}
        </div>
      {% endif %}

      <button type="submit" class="btn btn-login text-white">Registrarse</button>

      <div class="register-link mt-3 text-light text-center">
        ¿Ya tienes cuenta?
        <a href="{% url 'login' %}" class="ms-1">Iniciar sesión</a>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Toggle de mostrar/ocultar contraseña (sirve para ambos campos)
    document.querySelectorAll('.password-toggle').forEach(function(el){
      el.addEventListener('click', function(){
        const targetId = el.getAttribute('data-target');
        const input = document.getElementById(targetId);
        const icon = el.querySelector('i');
        if (!input) return;
        if (input.type === 'password') {
          input.type = 'text';
          icon.classList.replace('fa-eye', 'fa-eye-slash');
        } else {
          input.type = 'password';
          icon.classList.replace('fa-eye-slash', 'fa-eye');
        }
      });
    });
  </script>
</body>
</html>
