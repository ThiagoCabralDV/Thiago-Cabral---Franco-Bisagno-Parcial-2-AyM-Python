{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - Foro J</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'accounts/estilos.css' %}">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center min-vh-100">

  <div class="login-card text-dark">
    <div class="text-center mb-4">
      <h3 class="fw-bold text-light">🎮 Iniciar sesión</h3>
      <p class="text-secondary mb-0">Bienvenido de nuevo a <strong>Foro J</strong></p>
    </div>

    <form method="POST" action="">
      {% csrf_token %}
      <div class="mb-3">
        <label for="username" class="form-label text-light">Usuario</label>
        <div class="input-group">
          <input type="text" name="username" class="form-control" placeholder="Tu usuario" required>
          <span class="input-group-text"><i class="fas fa-user"></i></span>
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label text-light">Contraseña</label>
        <div class="input-group">
          <input type="password" name="password" class="form-control" placeholder="Tu contraseña" required>
          <span class="input-group-text password-toggle"><i class="fas fa-eye"></i></span>
        </div>
      </div>

      {% if messages %}
        <div class="alert alert-danger py-2">
          {% for message in messages %}
            {{ message }}
          {% endfor %}
        </div>
      {% endif %}

      <button type="submit" class="btn btn-login text-white">Iniciar sesión</button>

      <div class="register-link mt-3 text-light">
        ¿No tienes cuenta?
        <a href="{% url 'register' %}">Regístrate</a>
      </div>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Mostrar / ocultar contraseña
    document.querySelector('.password-toggle').addEventListener('click', function() {
      const input = document.querySelector('input[name="password"]');
      const icon = this.querySelector('i');
      if (input.type === "password") {
        input.type = "text";
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = "password";
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    });
  </script>
</body>
</html>
